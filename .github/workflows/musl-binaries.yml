name: musl-binaries

# Static, dependency-free `mk` binaries for air-gapped / Alpine / musl boxes —
# the environment a self-custody backup tool is most likely to run on (an
# offline, minimal box). Builds both musl targets and attaches a static tarball
# per arch + a per-arch SHA256SUMS to the `mk-cli-v*` release (alongside the
# `mk-man.tar.gz` the ci.yml release-on-tag job attaches).
#
# STANDALONE (not folded into ci.yml) because ci.yml ALSO fires on the
# `mk-codec-v*` codec tag, which must NOT build a CLI binary. This workflow
# triggers ONLY on `mk-cli-v*`.
#
# crt-static is ON BY DEFAULT for musl, so `cargo build --target *-linux-musl
# --release` already yields a fully-static ELF. NEVER pass
# `-Ctarget-feature=-crt-static` (per rust#135244 it silently links host glibc
# and destroys the static deliverable). The only C dep is the vendored
# libsecp256k1 in `secp256k1-sys` (via secp256k1 0.29.1).
#
# Per-arch `SHA256SUMS.<arch>` + `PROVENANCE.<arch>.txt` (each matrix job is
# independent + `gh release upload --clobber`-based, so a per-arch file avoids a
# clobber race on one combined file).
#
# ── workflow_dispatch = the REPRODUCIBILITY GATE, runnable WITHOUT a tag ─────
# A bare "Run workflow" click drives the `repro` caller job (the toolkit-homed
# reproducibility gate) against the current branch so `mk`'s offline two-block
# reproducibility can be CI-verified BEFORE any release tag relies on it. On a
# `workflow_dispatch` event `github.ref` is the branch, NOT a `refs/tags/mk-cli-v`
# tag. The `musl-binaries` legs still run -- build, package, minisign sign +
# verify SHA256SUMS.<arch> -- but their ensure-release / upload steps are
# tag-only, so a dispatch proves the signing secret works and publishes nothing.
#
# Security note: this workflow uses only GitHub-provided trusted context
# (matrix values, github.ref_name). No interpolation of untrusted user input.

on:
  push:
    tags:
      - 'mk-cli-v*'
  workflow_dispatch:

jobs:
  # ── REPRODUCIBILITY: the toolkit-homed gate (a codec re-home) ───────────────
  # Calls the centralized reusable workflow from mnemonic-toolkit (F6: ONE
  # source of truth for Dockerfile.repro + ci/repro/*.sh + the gate jobs). The
  # caller's `actions/checkout` provides `mk`'s source + committed `vendor/`;
  # each gate job additionally checks out the toolkit at the PINNED `toolkit_ref`
  # for the recipe. The `musl-binaries` x86_64 leg below consumes
  # `needs.repro.outputs.image` so the PUBLISHED artifact is produced by the
  # IDENTICAL container the gate measured.
  #
  # `mk` does NOT depend on the miniscript [patch.crates-io] fork (its
  # transitive `md-codec` dep is the crates.io release, not a git fork) → it
  # passes `miniscript_rev: ""` to select the TWO-block `--config` form (crates-io
  # + vendored-sources only; NO git-fork stanza). Empirically verified offline:
  # the two-block form resolves mk-cli fully from committed `vendor/` (EXIT 0),
  # and dropping `vendored-sources.directory` REDs (EXIT 101) — the directory
  # block is load-bearing.
  #
  # run_aarch64: true (F-680, operator ruling 2026-09-24) — BOTH byte-gates run
  # inline: x86_64 AND the slow (~4-10min QEMU) aarch64 `repro-aarch64-musl`.
  # `musl-binaries needs: repro` waits on the WHOLE reusable workflow, so a
  # release publish now waits for the aarch64 gate too — deliberately: `mk`'s
  # PUBLISHED aarch64 artifact (the `musl-binaries` cross leg below, re-homed
  # onto the digest-pinned Cross.toml recipe) is byte-gated before it ships.
  # The pin below contains toolkit 327f9a16 (F-675), which fixed the aarch64
  # remap-off residue check's pipefail/SIGPIPE race and cc-validate's
  # zero-residue false GREEN; an older pin would run the unfixed checks.
  #
  # toolkit_ref is a CONCRETE SHA (the F-675 fix, see below). It MUST be concrete:
  # the empty default falls back to the CALLER's SHA, which does not exist in the
  # toolkit repo (the recipe checkout would 404).
  repro:
    uses: bg002h/mnemonic-toolkit/.github/workflows/reproducible-musl-build.yml@4120af853ec68dc515cb4ac0eb7245a018a50c78
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      crate: mk-cli
      bin: mk
      target: x86_64-unknown-linux-musl
      arch: x86_64
      run_aarch64: true
      # mk is fork-free ⇒ EMPTY rev selects the TWO-block --config form.
      miniscript_rev: ""
      # Source the centralized recipe from the toolkit at the F-675 fix (4120af85,
      # toolkit master; contains 327f9a16). MUST match the `uses:` pin above.
      toolkit_ref: 4120af853ec68dc515cb4ac0eb7245a018a50c78

  # ── REPRODUCIBLE RE-HOME (toolkit-led `reproducible-builds-musl` cycle) ─────
  # The x86_64 leg's BUILD + PACKAGE now run INSIDE the digest-pinned repro
  # container (needs.repro.outputs.image, a ghcr.io/<owner>/repro-musl@sha256:…)
  # at the fixed /build/src with CARGO_HOME=/cargo and the full reproducibility
  # ENV (--remap-path-prefix, SOURCE_DATE_EPOCH off the COMMIT SHA, CFLAGS, the
  # TWO-block job-scoped [source] activation, gzip -n -9). So the published
  # SHA256 IS the hash the gate measured. The split-brain host `musl-tools` +
  # `CC_x86_64_unknown_linux_musl` are REMOVED — the container's musl-gcc
  # (pinned by the BUILT digest) is the only musl toolchain on this leg.
  #
  # MATRIX-SCOPE CONSTRAINT: this is a SINGLE combined x86_64+aarch64 matrix job;
  # a JOB-LEVEL `container:` is forbidden (it would wrap the aarch64 `cross` leg
  # into docker-in-docker). The re-home is therefore a per-STEP
  # `docker run --network=none <image>@sha256` on the x86_64 (`musl_native`) leg
  # ONLY. The aarch64 (`cross`) leg stays on the host runner (it is digest-pinned
  # via Cross.toml, NOT a docker-run re-home — cross already runs its own
  # digest-pinned container).
  #
  # NETWORK-ISOLATION BOUNDARY: `--network=none` wraps ONLY the in-container
  # build+package (proving the committed-vendor/ offline build touches no live
  # host). actions/checkout, ensure-release, and gh release upload REMAIN host
  # steps WITH network; they read the container-built .tar.gz + SHA256SUMS off
  # the bind-mounted workspace.
  #
  # On a bare `workflow_dispatch` the legs build, package, sign and verify, and
  # the step-level tag gates keep ensure-release / upload OFF (no release to
  # attach to).
  musl-binaries:
    name: musl-binary (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/mk-cli-v') || github.event_name == 'workflow_dispatch'
    needs: repro
    runs-on: ubuntu-latest
    # `contents: write` to upload release assets; `packages: read` so the
    # x86_64 (musl_native) leg can authenticate to GHCR and `docker pull` the
    # private-by-default BUILT repro image (the re-homed build runs INSIDE it).
    permissions:
      contents: write
      packages: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REF_NAME: ${{ github.ref_name }}
      REPRO_IMAGE: ${{ needs.repro.outputs.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            musl_native: true
            arch: x86_64
          - target: aarch64-unknown-linux-musl
            cross: true
            arch: aarch64
    steps:
      - uses: actions/checkout@v4

      # ── aarch64 (cross) leg — RE-HOMED reproducible ────────────────────────
      # The aarch64 musl binary has no native runner, so it is built via `cross`
      # under QEMU. The PUBLISHED aarch64 artifact is the REPRODUCIBLE one:
      #   * the cross runtime IMAGE is DIGEST-PINNED via the committed Cross.toml
      #     (cross reads it from the build CWD = the workspace root here);
      #   * the full reproducibility ENV reaches the QEMU container via Cross.toml
      #     [build.env] passthrough — SOURCE_DATE_EPOCH (off the COMMIT SHA),
      #     CFLAGS/CFLAGS_<triple> (-ffile-prefix-map), CARGO_BUILD_RUSTFLAGS
      #     (--remap-path-prefix), LC_ALL/TZ;
      #   * the remap FROM-side is cross's FIXED internal mount /project (cross
      #     v0.2.5 bind-mounts the workspace to /project), NOT the host path;
      #   * --locked --offline + the TWO-block job-scoped [source] activation
      #     against committed vendor/ (mk is fork-free → NO git-fork block);
      #   * gzip-pinned tar + a published PROVENANCE.aarch64.txt tuple.
      - if: ${{ matrix.cross }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.85.0'
          targets: ${{ matrix.target }}
      - if: ${{ matrix.cross }}
        run: cargo install --locked cross
      - name: build+package-cross (reproducible, digest-pinned via Cross.toml)
        if: ${{ matrix.cross }}
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$PWD"
          VER="${REF_NAME##*-v}"
          EPOCH="$(git show -s --format=%ct HEAD)"
          # The determinism-bearing env is EXPORTED so `cross` forwards it into
          # the QEMU container via Cross.toml [build.env] passthrough. The remap
          # from-side is cross's internal /project mount (NOT the host path).
          REMAP="--remap-path-prefix=/project=/build --remap-path-prefix=/cargo=/cargo"
          CFMAP="-ffile-prefix-map=/project=/build -ffile-prefix-map=/cargo=/cargo"
          umask 022
          env \
            SOURCE_DATE_EPOCH="$EPOCH" \
            LC_ALL=C TZ=UTC \
            CARGO_BUILD_RUSTFLAGS="$REMAP" \
            CFLAGS="$CFMAP" \
            CFLAGS_aarch64_unknown_linux_musl="$CFMAP" \
            cross build --locked --offline --release \
              --target "$TARGET" -p mk-cli --bin mk \
              --config 'source.crates-io.replace-with="vendored-sources"' \
              --config 'source.vendored-sources.directory="vendor"'
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$EPOCH" \
            -cf - -C "target/${TARGET}/release" mk \
            | gzip -n -9 > "mk-${VER}-${ARCH}-linux-musl.tar.gz"
          sha256sum "mk-${VER}-${ARCH}-linux-musl.tar.gz" > "SHA256SUMS.${ARCH}"
          # Publish the provenance tuple. The cross runtime image digest is the
          # canonical pin in Cross.toml.
          CROSS_IMG="$(grep -E '^image *=' Cross.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')"
          {
            echo "artifact: mk-${VER}-${ARCH}-linux-musl.tar.gz"
            echo "sha256:  $(cut -d' ' -f1 < "SHA256SUMS.${ARCH}")"
            echo "source_commit: $(git rev-parse HEAD)"
            echo "source_date_epoch: ${EPOCH}"
            echo "cross_image: ${CROSS_IMG}"
          } > "PROVENANCE.${ARCH}.txt"
          cat "PROVENANCE.${ARCH}.txt"

      # ── GHCR auth for the x86_64 leg's `docker pull` of the BUILT image ─────
      # The repro image is GHCR private-by-default; the per-step `docker run`
      # form needs an explicit `docker login` BEFORE the pull below.
      - name: Log in to GHCR (for the re-homed image pull)
        if: ${{ matrix.musl_native }}
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      # ── x86_64 (native) leg — RE-HOMED inside the digest-pinned container ───
      # docker run --network=none mounts the host workspace at /build/src,
      # builds with the full reproducibility env + the TWO-block job-scoped
      # [source] activation, packages with the gzip-pinned tar, and writes
      # target/ + the .tar.gz + SHA256SUMS back to the host via the bind mount.
      # SOURCE_DATE_EPOCH is keyed off the COMMIT SHA.
      - name: build+package (re-homed, --network=none, in @${{ needs.repro.outputs.image }})
        if: ${{ matrix.musl_native }}
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$PWD"
          VER="${REF_NAME##*-v}"
          EPOCH="$(git show -s --format=%ct HEAD)"
          docker pull "$REPRO_IMAGE"
          docker run --rm --network=none \
            -v "$PWD":/build/src -w /build/src \
            -e CARGO_HOME=/cargo \
            -e RUSTUP_TOOLCHAIN=1.85.0 \
            -e SOURCE_DATE_EPOCH="$EPOCH" \
            -e LC_ALL=C -e TZ=UTC \
            -e CARGO_BUILD_RUSTFLAGS="--remap-path-prefix=/build/src=/build --remap-path-prefix=/cargo=/cargo" \
            -e CFLAGS="-ffile-prefix-map=/build/src=/build -ffile-prefix-map=/cargo=/cargo" \
            -e "CFLAGS_x86_64_unknown_linux_musl=-ffile-prefix-map=/build/src=/build -ffile-prefix-map=/cargo=/cargo" \
            -e VER="$VER" -e ARCH="$ARCH" -e TARGET="$TARGET" \
            "$REPRO_IMAGE" \
            bash -euxo pipefail -c '
              umask 022
              cargo build --locked --offline --release \
                --target "$TARGET" -p mk-cli --bin mk \
                --config '"'"'source.crates-io.replace-with="vendored-sources"'"'"' \
                --config '"'"'source.vendored-sources.directory="vendor"'"'"'
              tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$SOURCE_DATE_EPOCH" \
                -cf - -C "target/$TARGET/release" mk \
                | gzip -n -9 > "mk-${VER}-${ARCH}-linux-musl.tar.gz"
              sha256sum "mk-${VER}-${ARCH}-linux-musl.tar.gz" > "SHA256SUMS.${ARCH}"
            '
          # Publish the provenance tuple alongside the artifacts.
          {
            echo "artifact: mk-${VER}-${ARCH}-linux-musl.tar.gz"
            echo "sha256:  $(cut -d' ' -f1 < "SHA256SUMS.${ARCH}")"
            echo "source_commit: $(git rev-parse HEAD)"
            echo "source_date_epoch: ${EPOCH}"
            echo "container_image: ${REPRO_IMAGE}"
          } > "PROVENANCE.${ARCH}.txt"
          cat "PROVENANCE.${ARCH}.txt"

      # ── minisign SHA256SUMS.<arch> ─────────────────────────────────────────
      # A HOST step: it runs after build+package has written the final digest,
      # and before anything is uploaded. The secret never enters the
      # --network=none build container or the cross container, and the
      # reproducibility gate (the `repro` job) runs in other jobs entirely.
      # Signing only ADDS SHA256SUMS.<arch>.minisig; the step hashes the
      # tarball, SHA256SUMS.<arch> and PROVENANCE.<arch>.txt before and after,
      # and fails if a single byte moved.
      #   release tag : secret missing, or sign/verify failing -> job FAILS
      #                 before ensure-release, so nothing from this leg uploads
      #   dispatch    : secret present -> sign + verify, upload nothing
      #                 secret missing -> warning, unsigned, upload nothing
      - name: install minisign
        run: sudo apt-get update -qq && sudo apt-get install -y -qq minisign
      - name: sign SHA256SUMS.${{ matrix.arch }} (host, after the digest is final)
        id: sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_SECRET_KEY_PASSWORD }}
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/mk-cli-v') }}
          ARCH: ${{ matrix.arch }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          SUMS="SHA256SUMS.${ARCH}"
          [ -s "$SUMS" ] || { echo "::error::$SUMS was not produced"; exit 1; }
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            if [ "$IS_RELEASE" = "true" ]; then
              echo "::error::MINISIGN_SECRET_KEY is not set, and this is a release tag. Refusing to publish $SUMS unsigned."
              exit 1
            fi
            echo "::warning::MINISIGN_SECRET_KEY is not set -- $SUMS stays UNSIGNED (not a release; nothing is uploaded)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          shopt -s nullglob
          surface=( mk-*-"${ARCH}"-linux-musl.tar.gz "$SUMS" )
          [ -f "PROVENANCE.${ARCH}.txt" ] && surface+=( "PROVENANCE.${ARCH}.txt" )
          [ "${#surface[@]}" -ge 2 ] || { echo "::error::no mk-*-${ARCH}-linux-musl.tar.gz to sign for"; exit 1; }
          before="$(sha256sum "${surface[@]}")"
          KEYFILE="$(mktemp)"
          trap 'rm -f "$KEYFILE"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$KEYFILE"
          if ! printf '%s\n' "$MINISIGN_PASSWORD" | \
               minisign -S -s "$KEYFILE" -m "$SUMS" -t "mk ${REF_NAME} $SUMS"; then
            [ -n "$MINISIGN_PASSWORD" ] || echo "::error::MINISIGN_SECRET_KEY_PASSWORD is empty; the key is password-protected, so it cannot sign until that secret is set."
            echo "::error::minisign could not sign $SUMS"
            exit 1
          fi
          rm -f "$KEYFILE"
          after="$(sha256sum "${surface[@]}")"
          if [ "$before" != "$after" ]; then
            echo "::error::signing changed a file the reproducibility gate hashes"
            diff <(echo "$before") <(echo "$after") || true
            exit 1
          fi
          echo "$before"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: verify SHA256SUMS.${{ matrix.arch }}.minisig against the pinned public key
        if: steps.sign.outputs.signed == 'true'
        env:
          MINISIGN_PUBKEY: 'RWQPmgBXsuw5yi8W0SfDr8KF+IqY/Z5U2p724emSODS1UPfJBP3agbKW'
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          minisign -Vm "SHA256SUMS.${ARCH}" -P "$MINISIGN_PUBKEY"
          echo "signature verified against pinned key $MINISIGN_PUBKEY"

      - name: ensure-release
        if: startsWith(github.ref, 'refs/tags/mk-cli-v')
        run: gh release view "$REF_NAME" >/dev/null 2>&1 || gh release create "$REF_NAME" --generate-notes || true
      - name: upload
        if: startsWith(github.ref, 'refs/tags/mk-cli-v')
        run: |
          gh release upload "$REF_NAME" mk-*-${{ matrix.arch }}-linux-musl.tar.gz --clobber
          # The sums file and its signature in ONE call: the release never
          # carries a new SHA256SUMS.<arch> beside a stale or missing .minisig.
          gh release upload "$REF_NAME" "SHA256SUMS.${{ matrix.arch }}" "SHA256SUMS.${{ matrix.arch }}.minisig" --clobber
          if [ -f "PROVENANCE.${{ matrix.arch }}.txt" ]; then
            gh release upload "$REF_NAME" "PROVENANCE.${{ matrix.arch }}.txt" --clobber
          fi
