# CI workflow for the `mnemonic-key` workspace.
#
# Triggers: push to main, push to mk-cli-v* / mk-codec-v* tags, PRs.
# Jobs: build matrix (3 toolchains × 3 OS = 9), fmt (pinned toolchain),
# vectors-roundtrip on stable, release-on-tag.
#
# Note on apt-get hangs: this workflow doesn't install texlive (no PDF
# build here, unlike the toolkit's manual workflow), so the recurring
# apt-get-hang recovery pattern (cancel + rerun) doesn't apply. One-line
# note retained for consistency with the toolkit / sibling workflows.

name: CI

on:
  push:
    branches: [main]
    tags:
      - 'mk-cli-v*'
      - 'mk-codec-v*'
  pull_request:

# Workflow-level permissions are not granted; each job declares its own.
# Only the release-on-tag job needs `contents: write` (release upload);
# build + fmt + vectors-roundtrip run with the default read-only token.

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.toolchain }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta, '1.85']
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.toolchain }}-${{ matrix.os }}

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # 1.95.0 is the canonical FORMATTING toolchain; bump it DELIBERATELY
  # (re-run `cargo +<new> fmt --all` in the same commit) — do not float
  # `stable` here (recurrence: FOLLOWUPS
  # `rustfmt-drift-fn-signature-collapse-3-files`: each rustfmt release
  # re-reds the repo). A committed rust-toolchain.toml would override this
  # pin too (rustup file-beats-default precedence) — keep the repo free of
  # one. The build matrix no longer runs fmt (it was 9x redundant and the
  # recurrence vector); clippy/build/test stay per-lane.
  fmt:
    name: fmt (pinned 1.95.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: conformance-vector checksum pin
        run: cd design && sha256sum -c display-grouping-vectors.tsv.sha256

      - name: Install Rust 1.95.0 (canonical fmt toolchain)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Rustfmt
        run: cargo fmt --check --all

  vectors-roundtrip:
    name: vectors-roundtrip
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: vectors-roundtrip-stable

      - name: Build mk-cli
        run: cargo build -p mk-cli --release

      - name: Run mk vectors --out
        run: |
          mkdir -p /tmp/vectors-out
          ./target/release/mk vectors --out /tmp/vectors-out

      - name: Diff against pinned corpus
        run: |
          set -eu
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y jq
          fi
          # Reconstruct the union from per-fixture files and diff against
          # the pinned corpus (sort by name to make the comparison
          # deterministic regardless of iteration order).
          pinned=$(jq -S '.vectors | sort_by(.name)' \
            crates/mk-codec/src/test_vectors/v0.1.json)
          rebuilt=$(jq -s -S 'sort_by(.name)' /tmp/vectors-out/*.json)
          if [ "$pinned" != "$rebuilt" ]; then
            echo "::error::vectors-roundtrip mismatch between mk vectors --out and pinned corpus"
            diff <(echo "$pinned") <(echo "$rebuilt") || true
            exit 1
          fi
          echo "vectors-roundtrip OK"

  freebsd-compile-gate:
    # Cycle C — FreeBSD compile-gate. Catches the day a Linux-only syscall /
    # cfg / crate breaks the `cargo install`-on-FreeBSD path, and compile-covers
    # the BSD secret-hygiene arm in `crates/mk-cli/src/process_hardening.rs`
    # (procctl/setrlimit). `x86_64-unknown-freebsd` is Tier 2 with Host Tools,
    # so `rustup target add` ships a precompiled std on the ubuntu runner; no
    # apt cross-compiler step is needed (cargo check stops before link; the only
    # C step is the vendored libsecp256k1 cc compile, which builds against the
    # Tier-2 std — validated locally with bare rustup). Fallback if that ever
    # needs a freebsd sysroot: switch to `cross check --target …` (cross-rs
    # bundles a freebsd container).
    #
    # CRITICAL — this MUST be a WHOLE-CRATE check (`cargo check --target …`),
    # NEVER `--lib`. mk-cli is a BIN-ONLY crate (no `src/lib.rs`); its
    # `process_hardening` lives only in the bin target (`mod process_hardening;`
    # in `main.rs`). A `cargo check --lib` would compile nothing relevant and
    # give silent false-green coverage of the entire BSD hardening arm. Only the
    # bare whole-crate check reaches `main.rs` and therefore the hardening
    # module. (The toolkit's `--lib` row is a special case that works only
    # because the toolkit alone declares `process_hardening` as `pub mod` in
    # `src/lib.rs`.)
    name: freebsd compile-gate (whole-crate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.85 + freebsd target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.85'
          targets: x86_64-unknown-freebsd
      - uses: Swatinem/rust-cache@v2
        with:
          key: freebsd-compile-gate
      - run: cargo check --target x86_64-unknown-freebsd -p mk-cli

  musl-check:
    # musl target coverage (static air-gapped binary cycle). Both musl targets
    # are Tier 2 with Host Tools and `unix` + Linux, so every `#[cfg(unix)]` /
    # `#[cfg(target_os = "linux")]` path (process_hardening) compiles + is
    # functional on musl with ZERO source change.
    #
    #   * x86_64-musl — built + tested natively (`cargo test -p mk-cli`). Needs
    #     `musl-tools` (`musl-gcc`) + `CC_x86_64_unknown_linux_musl=musl-gcc` so
    #     cc-rs builds the ONLY C dep (the vendored libsecp256k1 in
    #     `secp256k1-sys`) against musl.
    #   * aarch64-musl — `cross build`-only (cross bundles the musl cross C
    #     toolchain; build coverage, no emulated test run).
    #
    # crt-static left at its musl default (ON). NEVER pass
    # `-Ctarget-feature=-crt-static` (rust#135244 silently links host glibc).
    # Toolchain pinned `@master` + `1.85.0` (mk house style; constellation
    # parity with the codec/toolkit `@1.85.0` musl jobs).
    name: musl compile/test (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            musl_native: true
          - target: aarch64-unknown-linux-musl
            cross: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.85.0 + musl target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.85.0'
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: musl-check-${{ matrix.target }}
      - name: install musl-tools (x86_64-musl native)
        if: ${{ matrix.musl_native }}
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: install cross (aarch64-musl)
        if: ${{ matrix.cross }}
        run: cargo install --locked cross
      - name: cargo test -p mk-cli --target x86_64-musl (native)
        if: ${{ matrix.musl_native }}
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo test -p mk-cli --target ${{ matrix.target }}
      - name: cross build -p mk-cli --target aarch64-musl (build-only)
        if: ${{ matrix.cross }}
        run: cross build --release -p mk-cli --target ${{ matrix.target }}

  release-on-tag:
    name: release-on-tag
    if: startsWith(github.ref, 'refs/tags/mk-cli-v') || startsWith(github.ref, 'refs/tags/mk-codec-v')
    runs-on: ubuntu-latest
    needs: [build, fmt, vectors-roundtrip]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REF: ${{ github.ref }}
        run: |
          set -eu
          TAG="${GH_REF#refs/tags/}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; nothing to do"
          else
            gh release create "$TAG" --generate-notes
          fi

      - name: Install Rust (stable) for man-tarball build
        if: startsWith(github.ref, 'refs/tags/mk-cli-v')
        run: rustup toolchain install stable --profile minimal

      - name: Build + attach mk-man.tar.gz release asset
        if: startsWith(github.ref, 'refs/tags/mk-cli-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REF: ${{ github.ref }}
        run: |
          set -eu
          TAG="${GH_REF#refs/tags/}"
          cargo build --release -p mk-cli
          rm -rf man && mkdir man
          ./target/release/mk gen-man --out man
          # Negative canary: zero help-shadow pages (tripwire for an accidental pre-build).
          if ls man/*-help*.1 >/dev/null 2>&1; then
            echo "error: gen-man emitted *-help*.1 shadow pages" >&2
            exit 1
          fi
          tar -czf mk-man.tar.gz -C man .
          gh release upload "$TAG" mk-man.tar.gz --clobber
