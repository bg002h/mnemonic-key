[package]
name = "mk-cli"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Standalone CLI for mk1 (mnemonic-key) plate handling — encode, decode, inspect, verify, vectors."

[[bin]]
name = "mk"
path = "src/main.rs"

[dependencies]
mk-codec = { path = "../mk-codec" }
md-codec = { git = "https://github.com/bg002h/descriptor-mnemonic", tag = "md-codec-v0.16.1" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bitcoin = "0.32"
hex = "0.4"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[lints]
workspace = true
