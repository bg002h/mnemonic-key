[package]
name = "mk-cli"
version = "0.12.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Standalone CLI for mk1 (mnemonic-key) plate handling — encode, decode, inspect, verify, repair, address, derive, vectors, gui-schema."
homepage = "https://github.com/bg002h/mnemonic-key"
documentation = "https://docs.rs/mk-cli"
readme = "README.md"
keywords = ["bitcoin", "bip32", "xpub", "cli", "engraving"]
categories = ["cryptography::cryptocurrencies", "command-line-utilities"]

[[bin]]
name = "mk"
path = "src/main.rs"

[dependencies]
mk-codec = { path = "../mk-codec", version = "0.4.0" }
# v0.4.1 cycle: bumped to md-codec 0.34.0 (v0.18+ wire-format series).
# Pre-bump pin was 0.32.1; the from_md1_derivation test fixture was
# regenerated against v0.34.0's canonical pkh_basic.phrase.txt.
md-codec = "0.34.0"
clap = { version = "4", features = ["derive"] }
clap_mangen = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bitcoin = "0.32"
hex = "0.4"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[lints]
workspace = true
