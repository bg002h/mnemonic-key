[package]
name = "mk-cli"
version = "0.13.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Standalone CLI for mk1 (mnemonic-key) plate handling — encode, decode, inspect, verify, repair, address, derive, vectors, gui-schema."
homepage = "https://github.com/bg002h/mnemonic-key"
documentation = "https://docs.rs/mk-cli"
readme = "README.md"
keywords = ["bitcoin", "bip32", "xpub", "cli", "engraving"]
categories = ["cryptography::cryptocurrencies", "command-line-utilities"]

[[bin]]
name = "mk"
path = "src/main.rs"

[dependencies]
mk-codec = { path = "../mk-codec", version = "0.5.0" }
# F-127 cycle: bumped to md-codec 0.42.0, the primary's current version.
#
# At 0.34.0 this CLI could not read a CHUNKED md1 at all -- every chunk was
# refused with "wire-format version mismatch: got 9, expected 4", because a
# chunk is not a standalone card and 0.34 predates the v9 chunk series. Single
# md1 strings worked, so the gap was invisible until a wallet outgrew one
# string. Measured: `mk encode --from-md1` failed on every chunked card the
# constellation produces, which forced the stub to be computed BY HAND and
# passed as --policy-id-stub.
#
# Earlier note, kept: the v0.4.1 cycle bumped from 0.32.1 to 0.34.0, and the
# from_md1_derivation fixture was regenerated against 0.34.0's canonical
# pkh_basic.phrase.txt.
md-codec = "0.42.0"
clap = { version = "4", features = ["derive"] }
clap_mangen = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bitcoin = "0.32"
hex = "0.4"

# P3's boundary table: `mk` ADOPTs ONE item from the shared constellation IO
# crate -- `write::write_private`, which `mk encode --out FILE` uses to create
# its artifact owner-only. The other ten items are declined (see the plan).
#
# PINNED BY REV, not by `path =`: a path does not resolve in a fresh CI checkout
# and this constellation exists at more than one filesystem location. The crate
# is not on crates.io.
#
# `version` IS REQUIRED HERE even though the source is git. Without it
# `cargo package -p mk-cli` exits 101 with "all dependencies must have a version
# specified when packaging" -- and mk-cli IS published (17 versions on
# crates.io). With it, packaging fails only on the pre-existing unpublished
# `mk-codec 0.5.0`, byte-identical to the no-pin control. Measured both ways.
# It does mean `mnemonic-io-lib 0.1.0` must reach crates.io before the next
# `mk-cli-v*` publish.
#
# `write` has NO root re-export in the crate's `lib.rs`, so the call is written
# `mnemonic_io_lib::write::write_private`; the unqualified path is an E0425.
#
# A GIT SOURCE IN Cargo.lock IS LOAD-BEARING FOR TWO CI SURFACES. Re-run
# `cargo vendor vendor/` whenever this rev moves, and see F-341: the tag-time
# reproducible musl build passes a TWO-block `--config` source list that cannot
# redirect this source, and the fix is in another repo's shared workflow.
mnemonic-io-lib = { git = "https://github.com/bg002h/mnemonic-engrave", rev = "6c24e62823e6c1ac02aa3862cd6020674bf58544", version = "0.1.0" }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[lints]
workspace = true
