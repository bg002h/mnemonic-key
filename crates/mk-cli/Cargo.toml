[package]
name = "mk-cli"
version = "0.13.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Standalone CLI for mk1 (mnemonic-key) plate handling — encode, decode, inspect, verify, repair, address, derive, vectors, gui-schema."
homepage = "https://github.com/bg002h/mnemonic-key"
documentation = "https://docs.rs/mk-cli"
readme = "README.md"
keywords = ["bitcoin", "bip32", "xpub", "cli", "engraving"]
categories = ["cryptography::cryptocurrencies", "command-line-utilities"]

[[bin]]
name = "mk"
path = "src/main.rs"

[dependencies]
mk-codec = { path = "../mk-codec", version = "0.5.0" }
# F-127 cycle: bumped to md-codec 0.42.0, the primary's current version.
#
# At 0.34.0 this CLI could not read a CHUNKED md1 at all -- every chunk was
# refused with "wire-format version mismatch: got 9, expected 4", because a
# chunk is not a standalone card and 0.34 predates the v9 chunk series. Single
# md1 strings worked, so the gap was invisible until a wallet outgrew one
# string. Measured: `mk encode --from-md1` failed on every chunked card the
# constellation produces, which forced the stub to be computed BY HAND and
# passed as --policy-id-stub.
#
# Earlier note, kept: the v0.4.1 cycle bumped from 0.32.1 to 0.34.0, and the
# from_md1_derivation fixture was regenerated against 0.34.0's canonical
# pkh_basic.phrase.txt.
md-codec = "0.42.0"
clap = { version = "4", features = ["derive"] }
clap_mangen = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bitcoin = "0.32"
hex = "0.4"

# P3's boundary table: `mk` ADOPTs ONE item from the shared constellation IO
# crate -- `write::write_private`, which `mk encode --out FILE` uses to create
# its artifact owner-only. The other ten items are declined (see the plan).
#
# TAKEN FROM THE REGISTRY, not by `path =`: a path does not resolve in a fresh
# CI checkout and this constellation exists at more than one filesystem
# location. And deliberately NOT by `git`+`rev` any more, now that
# `mnemonic-io-lib 0.1.0` is on crates.io.
#
# WHY THE REGISTRY AND NOT A REV. A git source has no published tarball, so both
# `Cargo.lock`'s `checksum` and the vendored `.cargo-checksum.json`'s `package`
# digest are null: nothing but bespoke hand-grounding in
# `ci/repro/vendor-freshness.sh` could vouch for the vendored bytes. A registry
# dependency is anchored by cargo itself, against an immutable tarball, on every
# build -- and it removes the LAST `source = "git+..."` entry from mk's
# Cargo.lock, so the gate's block list degrades to its two-block form.
#
# It also retires the packaging hazard the rev carried: a git source needs an
# explicit `version` or `cargo package -p mk-cli` exits 101 with "all
# dependencies must have a version specified when packaging", and mk-cli IS
# published (17 versions on crates.io). A registry dep cannot hit that class at
# all.
#
# `write` has NO root re-export in the crate's `lib.rs`, so the call is written
# `mnemonic_io_lib::write::write_private`; the unqualified path is an E0425.
mnemonic-io-lib = "0.1.0"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[lints]
workspace = true
