# mk-codec fuzz workspace — mk phase (the final phase) of the constellation
# stress-fuzz program (Cycle C). This is an OWN `[workspace]` so the repo
# root's `cargo build/test/clippy --workspace` and `cargo fmt --all` (mk's
# ci.yml runs both from the repo root) completely ignore it — the root
# workspace uses an explicit member list (`crates/mk-codec`, `crates/mk-cli`)
# and never globs nested Cargo.toml. NO-BUMP: infra + tests only, zero
# changes to crates/mk-codec/src/.
#
# Mirrors the md (descriptor-mnemonic/fuzz) and ms (mnemonic-secret/fuzz)
# phases. mk-codec is edition 2024; this fuzz package is its own package and
# also edition 2024 (matching the repo, same as the md/ms fuzz crates chose
# relative to their codecs).
[package]
name = "mk-codec-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.85"

[package.metadata]
cargo-fuzz = true

# Own workspace so the root workspace never sees this crate.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
# `KeyCard`'s fields are `bitcoin` types (Xpub / DerivationPath / Fingerprint),
# and mk-codec does not re-export them, so the corpus generator (which builds
# KeyCards from xpub/path fixtures) needs `bitcoin` directly. Pinned to the
# same major mk-codec depends on (0.32) so the lock resolves a single version.
bitcoin = "0.32"

[dependencies.mk-codec]
path = "../crates/mk-codec"

[profile.release]
debug = 1

# cargo-fuzz auto-discovers fuzz_targets/*.rs, but declaring each [[bin]]
# explicitly with test/doc off keeps `cargo build`/`cargo test` in this
# workspace from trying to build them as ordinary binaries.
[[bin]]
name = "mk1_decode"
path = "fuzz_targets/mk1_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mk1_decode_single"
path = "fuzz_targets/mk1_decode_single.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mk1_bch_correct_never_invalid"
path = "fuzz_targets/mk1_bch_correct_never_invalid.rs"
test = false
doc = false
bench = false
